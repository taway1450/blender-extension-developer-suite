# The `[[overrides]]` entry of this add-on in tests/typecheck/ty.toml sets explicit levels, which win over every
# `[blender] strictness` preset (spec #95). A rule not listed must report nothing.
[lenient]
blender-assumed-list-item = "error"
blender-assumed-context-member = "ignore"
blender-assumed-internal-operator = "warn"
blender-assumed-editor-member = "warn"
blender-assumed-preset-context = "warn"
blender-assumed-added-object = "warn"

[default]
blender-assumed-list-item = "error"
blender-assumed-context-member = "ignore"
blender-assumed-internal-operator = "warn"
blender-assumed-editor-member = "warn"
blender-assumed-preset-context = "warn"
blender-assumed-added-object = "warn"

[strict]
blender-assumed-list-item = "error"
blender-assumed-context-member = "ignore"
blender-assumed-internal-operator = "warn"
blender-assumed-editor-member = "warn"
blender-assumed-preset-context = "warn"
blender-assumed-added-object = "warn"
