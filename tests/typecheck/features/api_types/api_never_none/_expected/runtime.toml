[[probe]]
code = "(lambda scene: all(x is not None for x in (scene.view_settings, scene.eevee, scene.render.ffmpeg, scene.tool_settings.image_paint, bpy.data.cameras.new('api_never_none').dof)))(bpy.data.scenes.new('api_never_none'))"
expect = true
reason = "pointers to structs embedded by value are set on new data"

[[probe]]
code = "(lambda scene, ob: all(x is None for x in (scene.tool_settings.sculpt, ob.pose, ob.animation_data)))(bpy.data.scenes.new('api_never_none'), bpy.data.objects.new('api_never_none', None))"
expect = true
reason = "DNA pointers are None on new data"

[[probe]]
code = "bpy.context.preferences is not None and bpy.context.window_manager is not None"
expect = true
reason = "the context always has the preferences and the window manager"

[[probe]]
code = "(lambda kc: all(x is not None for x in (kc.active, kc.default, kc.addon, kc.user)))(bpy.context.window_manager.keyconfigs)"
expect = true
reason = "the window manager always has its key configurations"

[[probe]]
code = "all(x is not None for x in (bpy.data.materials.new('api_never_none').node_tree, bpy.data.worlds.new('api_never_none').node_tree, bpy.data.node_groups.new('api_never_none', 'GeometryNodeTree')))"
expect = true
reason = "new materials and worlds get a node tree, and node_groups.new() returns the tree"

[[probe]]
code = "bpy.data.node_groups.new('api_never_none', 'NoSuchTree')"
expect = "raises"
reason = "node_groups.new() raises for an unknown tree type instead of returning None"
