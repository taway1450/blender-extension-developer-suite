[[probe]]
code = "type(bpy.data.objects.new('narrow_constructors', None).constraints.new('COPY_LOCATION')).__name__"
expect = "CopyLocationConstraint"
reason = "constraints.new refines the new constraint by its type"

[[probe]]
code = "type(bpy.data.lights.new('narrow_constructors', 'SPOT')).__name__"
expect = "SpotLight"
reason = "lights.new refines the new light by its type"

[[probe]]
code = "type(bpy.data.meshes.new('narrow_constructors').attributes.new('weight', 'FLOAT', 'POINT')).__name__"
expect = "FloatAttribute"
reason = "attributes.new refines the new attribute by its data type"

[[probe]]
code = "type(bpy.data.node_groups.new('narrow_constructors', 'ShaderNodeTree').nodes.new(type='ShaderNodeMath')).__name__"
expect = "ShaderNodeMath"
reason = "nodes.new gives the node class its bl_idname names"

[[probe]]
code = "type(bpy.data.node_groups.new('narrow_constructors', 'NarrowConstructorsTree')).__name__"
expect = "NarrowConstructorsTree"
reason = "node_groups.new gives the add-on's tree class its bl_idname names"

[[probe]]
code = "(lambda tree: type(tree.nodes.new('NarrowConstructorsNode').outputs['Own']).__name__)(bpy.data.node_groups.new('narrow_constructors', 'NarrowConstructorsTree'))"
expect = "NarrowConstructorsSocket"
reason = "outputs.new gives the add-on's socket class its bl_idname names"

[[probe]]
code = "(lambda tree: type(tree.nodes.new('NarrowConstructorsNode').inputs['Value']).__name__)(bpy.data.node_groups.new('narrow_constructors', 'NarrowConstructorsTree'))"
expect = "NodeSocketFloat"
reason = "inputs.new gives the socket class its bl_idname names"

[[probe]]
code = "type(bpy.data.node_groups.new('narrow_constructors', 'ShaderNodeTree').interface.new_socket('Factor', socket_type='NodeSocketFloat')).__name__"
expect = "NodeTreeInterfaceSocketFloat"
reason = "new_socket gives the interface socket of the socket type its bl_idname names"

[[probe]]
code = "bpy.data.node_groups.new('narrow_constructors', 'GeometryNodeTree').interface.new_socket('Shader', socket_type='NodeSocketShader')"
expect = "raises"
reason = "new_socket's socket_type lists only the types the tree supports, so its swap of an unsupported one is unreachable"

[[probe]]
code = "bpy.data.objects.new('narrow_constructors', bpy.data.cameras.new('narrow_constructors')).type"
expect = "CAMERA"
reason = "objects.new takes the object type from the data"

[[probe]]
code = "bpy.data.objects.new('narrow_constructors', None).type"
expect = "EMPTY"
reason = "objects.new without data makes an empty"
