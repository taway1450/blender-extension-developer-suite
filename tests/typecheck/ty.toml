# ty configuration for the feature tests (mise run check:features / check:ide / check:oracle).
# The stubs and the Python version are passed on the command line per stub generator and Blender version.

[environment]
# Every addon is a top-level package (or module), as Blender loads it, so every directory that holds addons
# is a root. ty has no glob patterns here; `mise run features:generate` keeps this list up to date.
# BEGIN generated roots (scripts/generate_features.py)
root = [
    "features/addon_discovery",
    "features/addon_preferences",
    "features/api_types",
    "features/assumptions",
    "features/bpy_symbols",
    "features/bpy_symbols/generated",
    "features/context_members",
    "features/implied_narrowings",
    "features/imprecise_annotations",
    "features/inheritance",
    "features/inheritance/generated",
    "features/operator_calls",
    "features/operator_properties",
    "features/pointer_aliases",
    "features/properties",
    "features/properties/generated",
    "features/property_wrappers",
    "features/registration",
    "features/registration_checks",
    "features/type_narrowing",
]
# END generated roots

[src]
# Reference stubs for check:oracle, not part of the addons.
exclude = ["**/_expected/**"]

[rules]
# An expected error (`# ty: ignore[rule]`) that ty no longer reports is a failure.
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"
# Default already; stated because the assert_type markers rely on it.
type-assertion-failure = "error"

# The Imprecise annotation rules configured for one add-on (features/imprecise_annotations/imp_config): the
# category's level, overridden for one of its rules.
[[overrides]]
include = ["features/imprecise_annotations/imp_config/**"]

[overrides.rules]
blender-imprecise-annotations = "error"
blender-imprecise-enum-value = "ignore"

# The Implied narrowing rules configured for one add-on (features/implied_narrowings/nar_config).
[[overrides]]
include = ["features/implied_narrowings/nar_config/**"]

[overrides.rules]
blender-implied-narrowings = "error"
blender-narrowed-by-menu-prefix = "ignore"

# The Assumption rules configured for one add-on (features/assumptions/asm_config).
[[overrides]]
include = ["features/assumptions/asm_config/**"]

[overrides.rules]
blender-assumptions = "error"
blender-assumed-context-member = "ignore"
blender-assumed-internal-operator = "warn"
blender-assumed-editor-member = "warn"
blender-assumed-preset-context = "warn"
blender-assumed-added-object = "warn"
