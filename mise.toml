flag "--blender <path>" help="Blender binary (or its directory) to use instead of downloading one"
flag "--generator <generator>" default="all" help="Stub generator: fake-bpy-module, builtin (Blender's own, 5.2+), runtime (the fork's, from a running Blender) or all (fake-bpy-module and builtin where available)" {
  choices "fake-bpy-module" "builtin" "runtime" "all"
