[tasks."ty:build"]
description = "Build ty from the ty-blender submodule"
usage = '''
flag "--debug" help="Build a debug binary instead of a release binary"
'''
run = 'uv run scripts/build_ty.py {% if usage.debug %}--debug{% endif %}'

[tasks."blender:download"]
description = "Download an official Blender release binary into .cache/blender-bin/"
usage = '''
arg "<version>" help="Blender version as X.Y (e.g. 5.2)"
flag "--force" help="Download and extract again even if cached"
'''
run = 'uv run scripts/download_blender.py {{usage.version}} {% if usage.force %}--force{% endif %}'

[tasks."blender:build"]
description = "Build Blender from source (a branch, tag, commit or PR) into .cache/blender-bin/<name>"
usage = '''
arg "<name>" help="Build name, used as <version> by the other tasks (e.g. main); also the default git ref"
flag "--ref <ref>" help="Blender git ref to build instead of <name> (e.g. a branch, a commit or refs/pull/123/head)"
flag "--update" help="Fetch the ref again and rebuild its latest commit"
flag "--config <config>" default="full" help="CMake preset build_files/cmake/config/blender_<config>.cmake (full, lite, headless, release, ...)"
flag "--build-type <type>" default="Release" help="CMake build type" {
  choices "Release" "RelWithDebInfo" "Debug"
}
flag "--force" help="Delete the build directory and build from scratch"
'''
run = '''
uv run scripts/build_blender.py {{usage.name}} --config "{{usage.config}}" --build-type "{{usage.build_type}}"
{%- if usage.ref %} --ref "{{usage.ref}}"{% endif %}
{%- if usage.update %} --update{% endif %}
{%- if usage.force %} --force{% endif %}
'''

[tasks."stubs:generate"]
description = "Generate bpy stubs with fake-bpy-module and Blender's own stub generator (downloads the Blender release if needed)"
usage = '''
arg "<version>" help="Blender version as X.Y (e.g. 5.2), or the name of a blender:build build (e.g. main)"
flag "--ref <ref>" help="Blender git ref to check out instead of blender-vX.Y-release / the build name"
flag "--blender <path>" help="Blender binary (or its directory) to use instead of downloading one"
flag "--generator <generator>" default="all" help="Stub generator: fake-bpy-module, builtin (Blender's own, 5.2+) or all (both where available)" {
  choices "fake-bpy-module" "builtin" "all"
}
flag "--force" help="Recreate the source worktree and regenerate the stubs"
'''
run = '''
uv run scripts/generate_stubs.py {{usage.version}}
{%- if usage.ref %} --ref "{{usage.ref}}"{% endif %}
{%- if usage.blender %} --blender "{{usage.blender}}"{% endif %} --generator "{{usage.generator}}"
{%- if usage.force %} --force{% endif %}
'''

[tasks."check:blender"]
description = "Type-check the Blender source code with ty"
usage = '''
arg "<version>" help="Blender version as X.Y (e.g. 5.2), or the name of a blender:build build (e.g. main)"
flag "--debug" help="Use a debug build of ty"
flag "--ref <ref>" help="Blender git ref to check out instead of blender-vX.Y-release / the build name"
flag "--blender <path>" help="Blender binary (or its directory) to use instead of downloading one"
flag "--generator <generator>" default="all" help="Stub generator: fake-bpy-module, builtin (Blender's own, 5.2+) or all (both where available)" {
  choices "fake-bpy-module" "builtin" "all"
}
flag "--force" help="Recreate the source worktree and regenerate the stubs"
'''
run = '''
uv run scripts/check_blender.py {{usage.version}}
{%- if usage.debug %} --debug{% endif %}
{%- if usage.ref %} --ref "{{usage.ref}}"{% endif %}
{%- if usage.blender %} --blender "{{usage.blender}}"{% endif %} --generator "{{usage.generator}}"
{%- if usage.force %} --force{% endif %}
'''

[tasks."check:addons"]
description = "Type-check the example addons in examples/addons/ with ty"
usage = '''
arg "<version>" help="Blender version as X.Y (e.g. 5.2), or the name of a blender:build build (e.g. main)"
arg "[addons]" var=#true help="Addon directory names in examples/addons/ (default: all)"
flag "--debug" help="Use a debug build of ty"
flag "--blender <path>" help="Blender binary (or its directory) to use instead of downloading one"
flag "--generator <generator>" default="all" help="Stub generator: fake-bpy-module, builtin (Blender's own, 5.2+) or all (both where available)" {
  choices "fake-bpy-module" "builtin" "all"
}
'''
run = '''
uv run scripts/check_addons.py {{usage.version}}
{%- for addon in usage.addons %} {{addon}}{% endfor %}
{%- if usage.debug %} --debug{% endif %}
{%- if usage.blender %} --blender "{{usage.blender}}"{% endif %} --generator "{{usage.generator}}"
'''

[tasks."check:features"]
description = "Type-check the feature tests in tests/typecheck/ with ty and compare with tests/typecheck/expected/"
usage = '''
arg "<version>" help="Blender version as X.Y (e.g. 5.2), or the name of a blender:build build (e.g. main)"
arg "[features]" var=#true help="Feature directory names in tests/typecheck/features/ (default: all)"
flag "--update" help="Rewrite tests/typecheck/expected/<generator>/<version>.txt instead of comparing"
flag "--debug" help="Use a debug build of ty"
flag "--blender <path>" help="Blender binary (or its directory) to use instead of downloading one"
flag "--generator <generator>" default="all" help="Stub generator: fake-bpy-module, builtin (Blender's own, 5.2+) or all (both where available)" {
  choices "fake-bpy-module" "builtin" "all"
}
'''
run = '''
uv run scripts/check_features.py {{usage.version}}
{%- for feature in usage.features %} {{feature}}{% endfor %}
{%- if usage.update %} --update{% endif %}
{%- if usage.debug %} --debug{% endif %}
{%- if usage.blender %} --blender "{{usage.blender}}"{% endif %} --generator "{{usage.generator}}"
'''

[tasks."check:oracle"]
description = "Check the feature tests' markers with stock ty against their reference stubs (tests/typecheck/features/*/*/_expected/)"
usage = '''
arg "<version>" help="Blender version as X.Y (e.g. 5.2), or the name of a blender:build build (e.g. main)"
arg "[features]" var=#true help="Features or addons (feature/addon) in tests/typecheck/features/ (default: all)"
flag "--blender <path>" help="Blender binary (or its directory) to use instead of downloading one"
flag "--generator <generator>" default="all" help="Stub generator: fake-bpy-module, builtin (Blender's own, 5.2+) or all (both where available)" {
  choices "fake-bpy-module" "builtin" "all"
}
'''
run = '''
uv run scripts/check_oracle.py {{usage.version}}
{%- for feature in usage.features %} {{feature}}{% endfor %}
{%- if usage.blender %} --blender "{{usage.blender}}"{% endif %} --generator "{{usage.generator}}"
'''

[tasks."check:load"]
description = "Load every feature-test addon in Blender (import, register, unregister) and compare with its _expected/runtime.toml"
usage = '''
arg "<version>" help="Blender version as X.Y (e.g. 5.2), or the name of a blender:build build (e.g. main)"
arg "[features]" var=#true help="Features or addons (feature/addon) in tests/typecheck/features/ (default: all)"
flag "--blender <path>" help="Blender binary (or its directory) to use instead of downloading one"
'''
run = '''
uv run scripts/check_load.py {{usage.version}}
{%- for feature in usage.features %} {{feature}}{% endfor %}
{%- if usage.blender %} --blender "{{usage.blender}}"{% endif %}
'''

[tasks."features:generate"]
description = "Write the generated feature-test addons (tests/typecheck/features/*/generated/) and the import roots in tests/typecheck/ty.toml"
usage = '''
flag "--check" help="Fail if the generated files are out of date instead of writing them"
'''
run = 'uv run scripts/generate_features.py {% if usage.check %}--check{% endif %}'

[tasks."check:ide"]
description = "Query ty's language server at the markers in tests/typecheck/ (hover, signature help, completions) and compare with tests/typecheck/expected/"
usage = '''
arg "<version>" help="Blender version as X.Y (e.g. 5.2), or the name of a blender:build build (e.g. main)"
arg "[features]" var=#true help="Feature directory names in tests/typecheck/features/ or tests/typecheck/ide/ (default: all)"
flag "--update" help="Rewrite tests/typecheck/expected/<generator>/<version>.ide.md instead of comparing"
flag "--debug" help="Use a debug build of ty"
flag "--blender <path>" help="Blender binary (or its directory) to use instead of downloading one"
flag "--generator <generator>" default="all" help="Stub generator: fake-bpy-module, builtin (Blender's own, 5.2+) or all (both where available)" {
  choices "fake-bpy-module" "builtin" "all"
}
'''
run = '''
uv run scripts/check_ide.py {{usage.version}}
{%- for feature in usage.features %} {{feature}}{% endfor %}
{%- if usage.update %} --update{% endif %}
{%- if usage.debug %} --debug{% endif %}
{%- if usage.blender %} --blender "{{usage.blender}}"{% endif %} --generator "{{usage.generator}}"
'''

[tasks."check:stubs"]
description = "Type-check the generated bpy stubs themselves with ty"
usage = '''
arg "<version>" help="Blender version as X.Y (e.g. 5.2), or the name of a blender:build build (e.g. main)"
flag "--debug" help="Use a debug build of ty"
flag "--ref <ref>" help="Blender git ref to check out instead of blender-vX.Y-release / the build name"
flag "--blender <path>" help="Blender binary (or its directory) to use instead of downloading one"
flag "--generator <generator>" default="all" help="Stub generator: fake-bpy-module, builtin (Blender's own, 5.2+) or all (both where available)" {
  choices "fake-bpy-module" "builtin" "all"
}
flag "--force" help="Recreate the source worktree and regenerate the stubs"
'''
run = '''
uv run scripts/check_stubs.py {{usage.version}}
{%- if usage.debug %} --debug{% endif %}
{%- if usage.ref %} --ref "{{usage.ref}}"{% endif %}
{%- if usage.blender %} --blender "{{usage.blender}}"{% endif %} --generator "{{usage.generator}}"
{%- if usage.force %} --force{% endif %}
'''

[tasks."report:flags"]
description = "Tabulate Blender's RNA flags against runtime behaviour, the API docs and the bpy stubs"
usage = '''
arg "<version>" help="Blender version as X.Y (e.g. 5.2), or the name of a blender:build build (e.g. main)"
flag "--ref <ref>" help="Blender git ref to check out instead of blender-vX.Y-release / the build name"
flag "--blender <path>" help="Blender binary (or its directory) to use instead of downloading one"
flag "--generator <generator>" default="all" help="Stub generator: fake-bpy-module, builtin (Blender's own, 5.2+) or all (both where available)" {
  choices "fake-bpy-module" "builtin" "all"
}
flag "--force" help="Recreate the source worktree and regenerate the stubs"
'''
run = '''
uv run scripts/report_flags.py {{usage.version}}
{%- if usage.ref %} --ref "{{usage.ref}}"{% endif %}
{%- if usage.blender %} --blender "{{usage.blender}}"{% endif %} --generator "{{usage.generator}}"
{%- if usage.force %} --force{% endif %}
'''
