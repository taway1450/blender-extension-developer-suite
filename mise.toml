[tasks."ty:build"]
description = "Build ty from the ty-blender submodule"
usage = '''
flag "--profile <profile>" default="dev" help="Cargo profile to build ty with: dev (incremental, fastest rebuild), profiling (optimised, no LTO) or release (LTO, slow)" {
  choices "dev" "profiling" "release"
}
'''
run = 'uv run scripts/build_ty.py --profile "{{usage.profile}}"'

[tasks."ty:restore"]
description = "Download ty's build cache CI publishes (target/debug) so the next ty:build is a no-op or incremental (Linux)"
usage = '''
flag "--url <url>" help="Where the cache's files are (default: the newest build CI published)"
flag "--release <tag>" help="Restore an older build CI kept, e.g. ty-cache-20261123-3872f740fc"
flag "--force" help="Replace an existing target/debug with the cache"
'''
run = '''
uv run scripts/ty_cache.py restore
{%- if usage.url %} --url "{{usage.url}}"{% endif %}
{%- if usage.release %} --release "{{usage.release}}"{% endif %}
{%- if usage.force %} --force{% endif %}
'''

[tasks."ty:cache-pack"]
description = "Build ty (dev profile) from a clean ruff-blender checkout and pack target/debug as a cache into .cache/ty-cache/ (used by CI, Linux)"
run = 'uv run scripts/ty_cache.py pack'

[tasks."ty:test"]
description = "Run ty-blender's upstream Rust tests and mdtests (dev profile, never updates snapshots) as a regression check"
usage = '''
flag "--mdtest <path>" help="Run only this mdtest file, relative to crates/ty_python_semantic/resources/mdtest"
'''
run = 'uv run scripts/test_ty.py {% if usage.mdtest %}--mdtest "{{usage.mdtest}}"{% endif %}'

[tasks."ty:generate"]
description = "Regenerate ty-blender's generated docs and schemas (cargo dev generate-all, dev profile) after a change to its rules or options"
run = 'uv run scripts/generate_ty.py'

[tasks."ruff:build"]
description = "Build ruff from the ty-blender submodule (only to test a ruff change: lint:*/format:* run stock ruff)"
usage = '''
flag "--profile <profile>" default="dev" help="Cargo profile to build ruff with: dev (incremental, fastest rebuild), profiling (optimised, no LTO) or release (LTO, slow)" {
  choices "dev" "profiling" "release"
}
'''
run = 'uv run scripts/build_ruff.py --profile "{{usage.profile}}"'

[tasks."blender:download"]
description = "Download an official Blender release binary into .cache/blender-bin/"
usage = '''
arg "<version>" help="Blender version as X.Y (e.g. 5.2)"
flag "--force" help="Download and extract again even if cached"
'''
run = 'uv run scripts/download_blender.py {{usage.version}} {% if usage.force %}--force{% endif %}'

[tasks."blender:build"]
description = "Build Blender from source (a branch, tag, commit or PR) into .cache/blender-bin/<name>"
usage = '''
arg "<name>" help="Build name, used as <version> by the other tasks (e.g. main); also the default git ref"
flag "--ref <ref>" help="Blender git ref to build instead of <name> (e.g. a branch, a commit or refs/pull/123/head)"
flag "--update" help="Fetch the ref again and rebuild its latest commit"
flag "--config <config>" default="full" help="CMake preset build_files/cmake/config/blender_<config>.cmake (full, lite, headless, release, ...)"
flag "--build-type <type>" default="Release" help="CMake build type" {
  choices "Release" "RelWithDebInfo" "Debug"
}
flag "--force" help="Delete the build directory and build from scratch"
flag "--ccache" help="Compile through ccache (WITH_COMPILER_CCACHE), which must be installed"
'''
run = '''
uv run scripts/build_blender.py {{usage.name}} --config "{{usage.config}}" --build-type "{{usage.build_type}}"
{%- if usage.ref %} --ref "{{usage.ref}}"{% endif %}
{%- if usage.update %} --update{% endif %}
{%- if usage.force %} --force{% endif %}
{%- if usage.ccache %} --ccache{% endif %}
'''

[tasks."blender:restore"]
description = "Download the Blender build cache CI publishes (build directory, install, ccache) so the next blender:build is incremental (Linux)"
usage = '''
arg "<name>" help="Build name the cache was made for (e.g. main)"
flag "--url <url>" help="Where the cache's files are (default: the newest build CI published)"
flag "--release <tag>" help="Restore an older build CI kept, e.g. blender-cache-main-20261123-faa17d9072"
flag "--force" help="Replace an existing build directory and install with the cache"
flag "--ccache-only" help="Only restore ccache: works at any path, but the next build replays every compile"
'''
run = '''
uv run scripts/blender_cache.py restore {{usage.name}}
{%- if usage.url %} --url "{{usage.url}}"{% endif %}
{%- if usage.release %} --release "{{usage.release}}"{% endif %}
{%- if usage.force %} --force{% endif %}
{%- if usage.ccache_only %} --ccache-only{% endif %}
'''

[tasks."blender:cache-pack"]
description = "Pack a clean Blender build from source as a cache into .cache/blender-cache/<name>/ (used by CI, Linux)"
usage = '''
arg "<name>" help="Build name (e.g. main)"
'''
run = 'uv run scripts/blender_cache.py pack {{usage.name}}'

[tasks."stubs:generate"]
description = "Generate bpy stubs with fake-bpy-module and Blender's own stub generator (downloads the Blender release if needed)"
usage = '''
arg "<version>" help="Blender version as X.Y (e.g. 5.2), or the name of a blender:build build (e.g. main)"
flag "--ref <ref>" help="Blender git ref to check out instead of blender-vX.Y-release / the build name"
flag "--blender <path>" help="Blender binary (or its directory) to use instead of downloading one"
flag "--generator <generator>" default="all" help="Stub generator: fake-bpy-module, builtin (Blender's own, 5.2+), runtime (the fork's, from a running Blender) or all (fake-bpy-module and builtin where available)" {
  choices "fake-bpy-module" "builtin" "runtime" "all"
}
flag "--force" help="Recreate the source worktree and regenerate the stubs"
'''
run = '''
uv run scripts/generate_stubs.py {{usage.version}}
{%- if usage.ref %} --ref "{{usage.ref}}"{% endif %}
{%- if usage.blender %} --blender "{{usage.blender}}"{% endif %} --generator "{{usage.generator}}"
{%- if usage.force %} --force{% endif %}
'''

[tasks."check:blender"]
description = "Type-check the Blender source code with ty"
usage = '''
arg "<version>" help="Blender version as X.Y (e.g. 5.2), or the name of a blender:build build (e.g. main)"
flag "--profile <profile>" default="dev" help="Cargo profile to build ty with: dev (incremental, fastest rebuild), profiling (optimised, no LTO) or release (LTO, slow)" {
  choices "dev" "profiling" "release"
}
flag "--ty <path>" help="Use this ty binary instead of building one (skips the build)"
flag "--ref <ref>" help="Blender git ref to check out instead of blender-vX.Y-release / the build name"
flag "--blender <path>" help="Blender binary (or its directory) to use instead of downloading one"
flag "--generator <generator>" default="all" help="Stub generator: fake-bpy-module, builtin (Blender's own, 5.2+), runtime (the fork's, from a running Blender) or all (fake-bpy-module and builtin where available)" {
  choices "fake-bpy-module" "builtin" "runtime" "all"
}
flag "--force" help="Recreate the source worktree and regenerate the stubs"
flag "--update" help="Record the bucket summary in tests/blender/expected/<generator>/main-summary.txt (main only) instead of comparing"
'''
run = '''
uv run scripts/check_blender.py {{usage.version}} --profile "{{usage.profile}}"
{%- if usage.ty %} --ty "{{usage.ty}}"{% endif %}
{%- if usage.ref %} --ref "{{usage.ref}}"{% endif %}
{%- if usage.blender %} --blender "{{usage.blender}}"{% endif %} --generator "{{usage.generator}}"
{%- if usage.force %} --force{% endif %}
{%- if usage.update %} --update{% endif %}
'''

[tasks."check:addons"]
description = "Type-check the example addons in examples/addons/ with ty and compare with examples/expected/"
usage = '''
arg "<version>" help="Blender version as X.Y (e.g. 5.2), or the name of a blender:build build (e.g. main)"
arg "[addons]" var=#true help="Addon directory names in examples/addons/ (default: all)"
flag "--update" help="Rewrite examples/expected/<generator>/<version>.txt instead of comparing"
flag "--profile <profile>" default="dev" help="Cargo profile to build ty with: dev (incremental, fastest rebuild), profiling (optimised, no LTO) or release (LTO, slow)" {
  choices "dev" "profiling" "release"
}
flag "--ty <path>" help="Use this ty binary instead of building one (skips the build)"
flag "--blender <path>" help="Blender binary (or its directory) to use instead of downloading one"
flag "--generator <generator>" default="all" help="Stub generator: fake-bpy-module, builtin (Blender's own, 5.2+), runtime (the fork's, from a running Blender) or all (fake-bpy-module and builtin where available)" {
  choices "fake-bpy-module" "builtin" "runtime" "all"
}
'''
run = '''
uv run scripts/check_addons.py {{usage.version}}
{%- for addon in usage.addons %} {{addon}}{% endfor %}
{%- if usage.update %} --update{% endif %} --profile "{{usage.profile}}"
{%- if usage.ty %} --ty "{{usage.ty}}"{% endif %}
{%- if usage.blender %} --blender "{{usage.blender}}"{% endif %} --generator "{{usage.generator}}"
'''

