[tasks."probe:freestyle"]
description = "Render with Freestyle in background Blender: a style module and the parameter editor run, seeded colours repeat (#136)"
usage = '''
arg "<version>" help="Name of a blender:build build (e.g. main) or Blender version X.Y"
'''
run = 'uv run scripts/probe_freestyle.py {{usage.version}}'

[tasks."probe:gltf-rigify"]
description = "Run glTF's import, export and round-trip tests and generate Rigify's metarigs and rig samples in background Blender (#137)"
usage = '''
arg "<version>" help="Name of a blender:build build (e.g. main) or Blender version X.Y"
flag "--only <part>" help="Run only one part" {
  choices "gltf" "rigify"
}
'''
run = 'uv run scripts/probe_gltf_rigify.py {{usage.version}} {% if usage.only %}--only {{usage.only}}{% endif %}'

[tasks."probe:modifiers-new"]
description = "Check in background Blender that the quick-effects operators and the FBX importer handle a modifier modifiers.new() rejects (#139)"
usage = '''
arg "<version>" help="Name of a blender:build build (e.g. main) or Blender version X.Y"
'''
run = 'uv run scripts/probe_modifiers_new.py {{usage.version}}'

[tasks."probe:blend-typing"]
description = "Run the four .blend typing prototypes (prototypes/blend_typing/) on its example add-ons: B reads each bound .blend without Blender, G opens it in background Blender, C writes an overlay from each, A types the add-ons' reveal_type calls; summary.md lists where B and G disagree"
usage = '''
arg "<version>" help="Name of a blender:build build (e.g. main) or Blender version X.Y"
flag "--make" help="Rebuild the generated example .blend files in Blender first"
flag "--update-overlays" help="Write the overlays from B into the example add-ons' _blend/"
'''
run = 'uv run scripts/probe_blend_typing.py {{usage.version}} {% if usage.make %}--make{% endif %} {% if usage.update_overlays %}--update-overlays{% endif %}'

[tasks."probe:runtime-stubs"]
description = "Compare the runtime stubs (stubs:generate --generator runtime) with the builtin and fake-bpy-module stubs, and run the runtime generator on add-ons: its delta, merged stubs and .blend overlays"
usage = '''
arg "<version>" help="Name of a blender:build build (e.g. main) or Blender version X.Y"
flag "--addon <path>" var=#true help="An add-on folder to run add-on mode on (default: two of the prototype add-ons in prototypes/blend_typing/examples/)"
'''
run = 'uv run scripts/probe_runtime_stubs.py {{usage.version}} {% for a in usage.addon %}--addon "{{a}}" {% endfor %}'

[tasks."probe:node-menus"]
description = "Draw every node-add and node-swap menu on a stub layout in background Blender, and list what changed since the last run (#138)"
usage = '''
arg "<version>" help="Name of a blender:build build (e.g. main) or Blender version X.Y"
'''
run = 'uv run scripts/probe_node_menus.py {{usage.version}}'

[tasks."probe:ui-draw"]
description = "Draw the panels and menus that raised in a rare state (no brush, pinned Properties editor, ...) in that state in background Blender, with the glTF and Freestyle checks (#148, #149)"
usage = '''
arg "<version>" help="Name of a blender:build build (e.g. main) or Blender version X.Y"
'''
run = 'uv run scripts/probe_ui_draw.py {{usage.version}}'

[tasks."probe:never-none"]
description = "Probe which RNA pointers and returns Blender leaves None, in edge states and over tests/files (#109, research)"
usage = '''
arg "<version>" help="Name of a blender:build build (e.g. main) or Blender version X.Y"
flag "--limit <n>" help="Only probe the first N corpus files"
'''
run = '''
uv run scripts/probe_never_none.py {{usage.version}}
{%- if usage.limit %} --limit {{usage.limit}}{% endif %}
'''
