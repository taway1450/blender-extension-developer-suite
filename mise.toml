arg "<version>" help="Blender version as X.Y (e.g. 5.2), or the name of a blender:build build (e.g. main)"
arg "[features]" var=#true help="Features or addons (feature/addon) in tests/typecheck/features/, or with --examples addon directory names in examples/addons/ (default: all)"
flag "--examples" help="Load the example addons in examples/addons/ instead of the feature-test addons"
flag "--blender <path>" help="Blender binary (or its directory) to use instead of downloading one"
'''
