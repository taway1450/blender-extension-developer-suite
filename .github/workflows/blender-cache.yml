# Builds Blender from source and publishes the build directory, install, ccache and the source's git LFS objects as
# the release blender-cache-<name>-<date>-<blender commit>, keeping the newest few. The release blender-cache-<name>
# holds only the newest build's manifest.json, pointing at it: `mise run blender:restore <name>` downloads that build
# in a cloud session so that its next `blender:build` is incremental instead of a two-hour cold build
# (docs/research/blender-build-cache-hosting.md); `--release <tag>` restores an older one.
#
# The precompiled libraries the source pins get a release of their own, blender-libs-linux_x64-<library commit>
# (pointer: blender-libs-linux_x64), published when there is none for that commit yet; `blender:build` extracts it
# instead of cloning the libraries. Only the source's git history comes from GitHub: the LFS files and the libraries
# exist only on projects.blender.org, which refuses runners with HTTP 403 for hours at a time, so with both in
# releases a run needs that server only for what changed since. Dispatch with libs_only to publish the libraries
# without building (minutes instead of hours).
#
# The default build is typecheck-fixes, the branch the blender submodule pins, of the fork github.com/taway1450/blender
# (a fork of Blender's GitHub mirror). It changes headers nearly every file includes (BLI_utildefines.hh, BKE_global.hh,
# DNA and RNA headers), so a cache of upstream main leaves about 90% of the build to redo when a session moves to the
# fork. Dispatch with name main for an upstream cache (the fork's main; `gh repo sync taway1450/blender` updates it).
#
# The cache only works at the absolute path it was built at, with the same compiler and ccache paths, so this job
# builds the way a Claude Code cloud session does: repo at /home/user/blender-extension-developer-suite,
# Ubuntu 24.04, gcc-14, ccache in /usr/local/bin, uv's cache in /root/.cache/uv and Python 3.13.
name: Blender build cache

on:
  workflow_dispatch:
    inputs:
      name:
        description: Build name (also the Blender git ref built, e.g. typecheck-fixes or main)
        default: typecheck-fixes
      cold:
        description: Build from scratch instead of starting from the previous cache
        type: boolean
        default: false
      keep:
        description: How many builds to keep (older releases are deleted)
        type: number
        default: 3
      libs_only:
        description: Only publish the precompiled libraries the source pins, without building
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC

permissions:
  contents: read

concurrency:
  group: blender-cache-${{ inputs.name || 'typecheck-fixes' }}${{ inputs.libs_only && '-libs' || '' }}
  cancel-in-progress: false

env:
  NAME: ${{ inputs.name || 'typecheck-fixes' }}
  KEEP: ${{ inputs.keep || 3 }}
  # How many releases of the precompiled libraries to keep.
  KEEP_LIBS: 2

# The build hands its archives to a separate publish job: a release call from the build job itself, 90 minutes in,
# was refused (HTTP 403, "Resource not accessible by integration") although the ty cache's job, with the same
# permissions, publishes fine; a short job gets a fresh token, and "Re-run failed jobs" retries the publish alone.
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    env:
      REPO_DIR: /home/user/blender-extension-developer-suite
      # The paths baked into the build directory and its configure arguments.
      UV_CACHE_DIR: /root/.cache/uv
      # The Python uv runs build_blender.py with: CMake comes from its script environment, under lib/python3.<minor>/,
      # and the build directory re-runs CMake from there. A cloud session's uv picks 3.13 (the runner's default is
      # 3.12); `blender:restore` refuses a cache whose CMake path is missing.
      UV_PYTHON: "3.13"
      CC: gcc-14
      CXX: g++-14
      SUITE_JOBS: "4"
      SUITE_MEMORY_LIMIT_GB: "0"
      # What build_blender.py uses with --ccache; set here too for `ccache --show-stats`.
      CCACHE_DIR: /home/user/blender-extension-developer-suite/.cache/ccache
      # Keeps the published ccache archive small (a full build is about 0.4 GB compressed).
      CCACHE_MAXSIZE: 3G
      # What the releases do not have yet (new git LFS files, a newer commit of the libraries) comes from
      # projects.blender.org, which has refused runners with HTTP 403 for hours at a time (runs 4 and 7): the scripts
      # retry those downloads after each of these waits (seconds).
      SUITE_FETCH_RETRY_WAITS: "60 180 420 900 1800"
    steps:
      - name: Free disk space
        run: |
          # The libraries, source, build directory, install, ccache and archives need about 20 GB.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Install the build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-14 g++-14 zstd git-lfs \
            libxxf86vm-dev libxfixes-dev libxi-dev libxkbcommon-dev libsm-dev libgl-dev libegl-dev \
            libwayland-dev libdecor-0-dev wayland-protocols libdbus-1-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev
          V=4.14.3
          curl -fsSL "https://github.com/ccache/ccache/releases/download/v$V/ccache-$V-linux-x86_64-glibc.tar.xz" | tar -xJ -C /tmp
          sudo install -m755 "/tmp/ccache-$V-linux-x86_64-glibc/ccache" /usr/local/bin/ccache
          sudo mkdir -p /home/user "$UV_CACHE_DIR"
          sudo chown "$USER" /home/user
          sudo chown -R "$USER" /root/.cache
          sudo chmod o+x /root

      - uses: astral-sh/setup-uv@v6
        with:
          # setup-uv sets UV_CACHE_DIR itself (to a runner path) unless told otherwise; the scripts' uv environments,
          # and with them the CMake and Ninja paths a Blender build records, live under it.
          cache-local-path: /root/.cache/uv

      - uses: jdx/mise-action@v2
        with:
          install: false

      - name: Check out at the cloud session's path
        run: |
          git clone --no-checkout "https://github.com/${{ github.repository }}" "$REPO_DIR"
          git -C "$REPO_DIR" checkout --detach "${{ github.sha }}"
          cd "$REPO_DIR"
          mise trust -q .
          # Blobs are fetched on demand when the build's worktree is created.
          GIT_LFS_SKIP_SMUDGE=1 git submodule update --init --filter=blob:none blender

      - name: Start from the previous cache
        if: ${{ !inputs.libs_only }}
        working-directory: ${{ env.REPO_DIR }}
        run: |
          # A cold build still takes the source's git LFS objects from the previous cache: they are downloads, not
          # build results.
          if [ "${{ inputs.cold }}" = true ]; then
            mise run blender:restore "$NAME" --lfs-only || echo "::notice::No git LFS objects in the previous cache"
          else
            mise run blender:restore "$NAME" || echo "::notice::No usable previous cache; building from scratch"
          fi

      - name: Build Blender
        if: ${{ !inputs.libs_only }}
        working-directory: ${{ env.REPO_DIR }}
        run: |
          mise run blender:build "$NAME" --update --ccache
          ccache --show-stats
          df -h /

      - name: Pack the cache
        working-directory: ${{ env.REPO_DIR }}
        run: |
          mise run blender:cache-pack "$NAME" ${{ inputs.libs_only && '--libs-only' || '' }}
          df -h /

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.libs_only }}
        with:
          name: blender-cache
          path: ${{ env.REPO_DIR }}/.cache/blender-cache/${{ env.NAME }}
          compression-level: 0 # already zstd
          retention-days: 3
          if-no-files-found: error

      # Only there when no release has the libraries at the commit the source pins.
      - uses: actions/upload-artifact@v4
        with:
          name: blender-libs
          path: ${{ env.REPO_DIR }}/.cache/blender-cache/libs-linux_x64
          compression-level: 0 # already zstd
          retention-days: 3
          if-no-files-found: ignore

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # create the release and upload its assets
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Each artifact in its own directory: artifacts/blender-cache and, if the build packed them, artifacts/blender-libs.
      - uses: actions/download-artifact@v4
        with:
          pattern: blender-*
          path: artifacts

      - name: Publish the precompiled libraries and keep the newest ${{ env.KEEP_LIBS }}
        run: |
          if [ ! -f artifacts/blender-libs/manifest.json ]; then
            echo "The precompiled libraries are published already" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cd artifacts/blender-libs
          REPO="${{ github.repository }}"
          TAG=$(jq -r .tag manifest.json)
          COMMIT=$(jq -r '.commit[:10]' manifest.json)
          POINTER="blender-libs-$(jq -r .platform manifest.json)"
          export PREFIX="$POINTER-"

          gh release delete "$TAG" -R "$REPO" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" -R "$REPO" --target "${{ github.sha }}" --prerelease --latest=false \
            --title "Blender precompiled libraries: ${POINTER#blender-libs-} at $COMMIT" \
            --notes "The shared clone of Blender's precompiled libraries at $COMMIT, in parts; \`mise run blender:build\` extracts it instead of cloning them from projects.blender.org." \
            ./*.tar.zst* manifest.json

          # The pointer to the newest libraries, for a source that pins a commit no release has.
          mkdir -p ../libs-pointer
          jq --arg url "https://github.com/$REPO/releases/download/$TAG" '. + {archives_url: $url}' manifest.json \
            > ../libs-pointer/manifest.json
          if ! gh release view "$POINTER" -R "$REPO" >/dev/null 2>&1; then
            gh release create "$POINTER" -R "$REPO" --target "${{ github.sha }}" --prerelease --latest=false \
              --title "Blender precompiled libraries: ${POINTER#blender-libs-} (newest)" \
              --notes "manifest.json of the newest release of Blender's precompiled libraries; the archives are in the release it names (archives_url)."
          fi
          gh release upload "$POINTER" -R "$REPO" --clobber ../libs-pointer/manifest.json

          gh release list -R "$REPO" --limit 200 --json tagName,createdAt \
            --jq '.[] | select(.tagName | startswith($ENV.PREFIX) and (ltrimstr($ENV.PREFIX) | test("^[0-9a-f]{10}$")))
                  | "\(.createdAt) \(.tagName)"' \
            | sort -r | tail -n +$((KEEP_LIBS + 1)) \
            | while read -r _ old; do
                echo "Deleting $old"
                gh release delete "$old" -R "$REPO" --cleanup-tag --yes
              done
          { echo "Published $TAG"; echo '```json'; cat manifest.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the build and keep the newest ${{ env.KEEP }}
        if: ${{ !inputs.libs_only }}
        working-directory: artifacts/blender-cache
        run: |
          REPO="${{ github.repository }}"
          COMMIT=$(jq -r '.commit[:10]' manifest.json)
          export PREFIX="blender-cache-$NAME-"
          TAG="$PREFIX$(date -u +%Y%m%d)-$COMMIT"
          POINTER="blender-cache-$NAME"

          # This build in its own release (replacing one of the same commit from earlier today).
          gh release delete "$TAG" -R "$REPO" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" -R "$REPO" --target "${{ github.sha }}" --prerelease --latest=false \
            --title "Blender build cache: $NAME at $COMMIT" \
            --notes "Build directory, install, ccache and git LFS objects of \`blender:build $NAME\` at Blender $COMMIT. Restore it with \`mise run blender:restore $NAME --release $TAG\`; see manifest.json for what it was built from." \
            ./*.tar.zst* manifest.json

          # The pointer to the newest build, which `blender:restore <name>` reads.
          mkdir -p ../pointer
          jq --arg url "https://github.com/$REPO/releases/download/$TAG" '. + {archives_url: $url}' manifest.json \
            > ../pointer/manifest.json
          if ! gh release view "$POINTER" -R "$REPO" >/dev/null 2>&1; then
            gh release create "$POINTER" -R "$REPO" --target "${{ github.sha }}" --prerelease --latest=false \
              --title "Blender build cache: $NAME (newest)" \
              --notes "manifest.json of the newest build of \`blender:build $NAME\`, which \`mise run blender:restore $NAME\` downloads; the archives are in the release it names (archives_url)."
          fi
          gh release upload "$POINTER" -R "$REPO" --clobber ../pointer/manifest.json

          # Delete all but the newest $KEEP builds (never the one just published: it is the newest).
          gh release list -R "$REPO" --limit 200 --json tagName,createdAt \
            --jq '.[] | select(.tagName | startswith($ENV.PREFIX) and (ltrimstr($ENV.PREFIX) | test("^[0-9]{8}-[0-9a-f]{10}$")))
                  | "\(.createdAt) \(.tagName)"' \
            | sort -r | tail -n +$((KEEP > 0 ? KEEP + 1 : 2)) \
            | while read -r _ old; do
                echo "Deleting $old"
                gh release delete "$old" -R "$REPO" --cleanup-tag --yes
              done
          { echo "Published $TAG"; echo '```json'; cat manifest.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
