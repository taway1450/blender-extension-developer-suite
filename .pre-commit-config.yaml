# prek (or pre-commit) hooks: `mise run lint:scripts` runs them on every file, `uvx prek@0.5.6 install`
# runs them on each commit. Only scripts/ and prototypes/source_stubs/ are linted and formatted here, with
# the pinned upstream ruff and scripts/ruff.toml (prototypes/source_stubs/ruff.toml extends it); Blender
# code goes through the ruff built from ty-blender (`mise run lint:*` / `format:*`).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(scripts|prototypes/source_stubs)/
      - id: ruff-format
        files: ^(scripts|prototypes/source_stubs)/
